name: Agent-Human Trainer CI & Public Cleanliness Gate

on:
  push:
    branches: [main, feat/agent-human-trainer]
  pull_request:
    branches: [main, feat/agent-human-trainer]

permissions:
  contents: read

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests (unittest / pytest)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify Zero-PII & Public Cleanliness Gate
        run: python -m agent_human_trainer --audit-cleanliness --benchmark
